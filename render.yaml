# Render Blueprint: website + API + worker + Postgres + Key Value (Redis), all from this one repo.
# In Render: New → Blueprint → pick this repository. Fill in the values marked "sync: false" when asked.
# Region: Frankfurt (closest to Armenia). Plans are a starting point; free plans do not fit
# (web services sleep, workers are not free, free Postgres expires after 30 days).

envVarGroups:
  # Shared by the API and the worker — they must use the same secrets.
  - name: briefluence-backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_EMAIL_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY # 32 random bytes, base64 (generated by Render)
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_URL # your public site address, e.g. https://briefluence.am
        sync: false
      - key: CORS_ORIGINS # same as WEB_URL
        sync: false
      - key: API_URL # the API's public address (used for links to uploaded files with local storage)
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD # strong password; then run `pnpm admin:create` once in the API Shell
        sync: false
      # Email
      - key: EMAIL_TRANSPORT
        value: resend
      - key: EMAIL_FROM
        value: "briefluence <no-reply@briefluence.am>"
      - key: RESEND_API_KEY
        sync: false
      # File uploads (Render disks are wiped on deploy → S3 / Cloudflare R2)
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      # Exchange rates
      - key: RATES_SOURCE
        value: cba
      # Social login + payments. Until the Meta/TikTok/Google apps and Ameriabank are approved,
      # keep the simulated versions on; set ALLOW_MOCKS_IN_PRODUCTION=false once real keys are in.
      - key: ALLOW_MOCKS_IN_PRODUCTION
        value: "true"
      - key: SOCIAL_MOCK
        value: "true"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: OAUTH_LOGIN_MOCK # simulated Google / Apple sign-in until their apps are set up
        value: "true"
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SUBSCRIPTION_PRICE_MINOR
        value: "999"
      - key: SUBSCRIPTION_CURRENCY
        value: USD
      - key: AMERIA_TEST_MODE
        value: "true"
      - key: AMERIA_CLIENT_ID
        sync: false
      - key: AMERIA_USERNAME
        sync: false
      - key: AMERIA_PASSWORD
        sync: false

services:
  # ── API (NestJS) ───────────────────────────────────────────
  - type: web
    name: briefluence-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @briefluence/api prisma:generate &&
      pnpm --filter "@briefluence/api..." build
    preDeployCommand: cd apps/api && npx prisma migrate deploy
    startCommand: cd apps/api && node dist/main.js
    healthCheckPath: /api/v1/health
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - fromGroup: briefluence-backend
      - key: PROCESS_ROLE # HTTP only; jobs run in the worker
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: briefluence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: briefluence-queue
          property: connectionString

  # ── Worker: queue jobs (emails, renewals, stats sync) + scheduled jobs ──
  - type: worker
    name: briefluence-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @briefluence/api prisma:generate &&
      pnpm --filter "@briefluence/api..." build
    startCommand: cd apps/api && node dist/worker.js
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - fromGroup: briefluence-backend
      - key: PROCESS_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: briefluence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: briefluence-queue
          property: connectionString

  # ── Website (Next.js) — attach your domain to this service ──
  - type: web
    name: briefluence-web
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter "@briefluence/web..." build
    startCommand: pnpm --filter @briefluence/web start
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # The website forwards /api/v1 to the API over Render's private network.
      - key: API_INTERNAL_HOSTPORT
        fromService:
          type: web
          name: briefluence-api
          property: hostport

  # ── Queue (Redis-compatible). BullMQ requires the noeviction policy. ──
  - type: keyvalue
    name: briefluence-queue
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only

databases:
  - name: briefluence-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
