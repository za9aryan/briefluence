# Briefluence on one server: Postgres + Redis (job queue) + API (with background jobs) + website +
# Caddy (HTTPS).
# Run from this folder:  docker compose up -d --build
name: briefluence

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefluence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: briefluence
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only the server itself can reach this port (for an SSH tunnel from your Mac); the internet
    # cannot (bound to 127.0.0.1, and Oracle's firewall only lets in 22/80/443).
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U briefluence -d briefluence']
      interval: 5s
      retries: 20

  # Job queue for emails, renewals and daily jobs (required in production). Saved to disk so
  # queued jobs survive a restart; only reachable inside this compose network.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    image: briefluence-app
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://briefluence:${POSTGRES_PASSWORD}@db:5432/briefluence
      API_PORT: '4000'
      REDIS_URL: redis://redis:6379
      # One process serves the API and runs the queue worker and scheduled jobs.
      PROCESS_ROLE: all
    working_dir: /app/apps/api
    # Database changes (migrations) are applied on every start, then the API starts.
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    # Same image the api service builds; never look for it on Docker Hub.
    image: briefluence-app
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    working_dir: /app/apps/web
    command: npx next start -p 3000 -H 0.0.0.0
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
